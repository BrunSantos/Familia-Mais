<!doctype html><html lang="pt-PT"><head><link rel="manifest" href="../manifest.webmanifest"><link rel="icon" type="image/png" href="../assets/favicon.png"><link rel="apple-touch-icon" sizes="180x180" href="../assets/apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Estuda+"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="theme-color" content="#193e70"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Estuda+ — Family and friends</title><style>*{box-sizing:border-box}body{margin:0;background:#f1f6fc;color:#19314f;font:17px system-ui,-apple-system,sans-serif}header{background:#193e70;color:white;padding:25px max(20px,calc((100vw - 850px)/2))}main{max-width:850px;margin:25px auto;padding:0 18px}.card{background:white;padding:22px;border-radius:16px;margin-bottom:16px;box-shadow:0 2px 10px #0001}.card h2{font-size:20px}.choice{display:block;padding:11px;margin:8px 0;border:1px solid #d5e0ee;border-radius:10px;cursor:pointer}.choice:has(input:checked){border-color:#2066b2;background:#eaf3ff}button,.back{display:inline-block;background:#2066b2;color:white;border:0;border-radius:10px;padding:13px 17px;text-decoration:none;font-weight:700;cursor:pointer}.back{background:#e0eafb;color:#193e70}.result{font-size:20px;font-weight:700}.good{color:#087544}.bad{color:#a43b2e}</style><style id="epbootstyle">#epboot{position:fixed;inset:0;z-index:2147483000;background:#edf4fc;display:flex;align-items:center;justify-content:center;padding:18px;font-family:system-ui,-apple-system,sans-serif;color:#19314f}#epboot>div{width:min(460px,100%);background:white;padding:28px;border-radius:20px;box-shadow:0 10px 40px #1234;text-align:center}#epboot h2{margin-top:0}#epboot p{line-height:1.5}#epboot a{color:#1769bd}#epbooterror{font-size:14px;color:#9b2c2c}#epboot button{background:#1b65b4;color:white;border:0;padding:11px 17px;border-radius:9px;cursor:pointer}#epboot button[hidden]{display:none}.epbook{position:relative;width:100px;height:76px;margin:8px auto 22px;perspective:500px;filter:drop-shadow(0 7px 6px #193e7033)}.epbook .epcover{position:absolute;inset:5px 3px 0;border-radius:4px 9px 9px 4px;background:#2366b1;transform:skewY(-3deg)}.epbook .epleft,.epbook .epright{position:absolute;top:10px;bottom:8px;width:47px;background:#fffef6;border:2px solid #c8d9e8}.epbook .epleft{left:5px;border-radius:8px 2px 2px 5px;transform:skewY(7deg)}.epbook .epright{right:5px;border-radius:2px 8px 5px 2px;transform:skewY(-7deg)}.epbook .eppage{position:absolute;top:11px;left:50%;width:44px;height:57px;border-radius:2px 7px 6px 2px;background:linear-gradient(90deg,#dce9f5,#fffdf5 18%,#fffdf5 90%,#e2ebf3);border:1px solid #cbdbe9;transform-origin:left center;animation:epflip 1.65s ease-in-out infinite}.epbook .eppage:nth-last-child(2){animation-delay:.36s}.epbook .eppage:last-child{animation-delay:.72s}@keyframes epflip{0%,13%{transform:rotateY(0deg)}60%,100%{transform:rotateY(-178deg)}}@media(prefers-reduced-motion:reduce){.epbook .eppage{animation:none}}</style><script defer src="../assets/estuda-qr.js?v=54.2"></script></head><body><div id="epboot" role="status" aria-live="polite"><div><div class="epbook" aria-hidden="true"><span class="epcover"></span><span class="epleft"></span><span class="epright"></span><span class="eppage"></span><span class="eppage"></span><span class="eppage"></span></div><h2>🔐 A entrar na tua conta…</h2><p id="epbootmessage">Só um instante, estamos a confirmar a tua sessão.</p><p id="epbooterror"></p><button type="button" id="epbootretry" hidden onclick="location.reload()">Tentar novamente</button></div></div><script>(function(){function fail(message){var box=document.getElementById('epboot');if(!box)return;document.getElementById('epbootmessage').textContent='Não foi possível iniciar a sessão.';document.getElementById('epbootretry').hidden=false;document.getElementById('epbooterror').textContent=message;}window.estudaBootFail=fail;if(location.protocol==='file:'){fail('Estás a abrir o ficheiro diretamente. Abre o Estuda+ através do servidor local (http://localhost:8000) ou do site publicado.');}else{setTimeout(function(){if(document.getElementById('epboot'))fail('A ligação está a demorar mais do que o esperado. Verifica a internet e tenta novamente.');},12000)}})();</script><header><h1>Family and friends</h1><p>Inglês · 5.º ano</p></header><main><a class="back" href="index.html#ingles">← Voltar a Inglês</a><div class="card"><strong>Ficha de treino original · Escolha múltipla</strong><p>21 perguntas com quatro opções. Seleciona uma resposta por pergunta e carrega em «Corrigir respostas».</p></div><form id="quiz"></form><div class="card"><button type="button" id="check">Corrigir respostas</button> <button type="button" id="reset" style="background:#536780">Recomeçar</button><p id="result" class="result" role="status" aria-live="polite"></p></div></main><script>const questions=[{"q": "What is the English word for «irmã»?", "a": ["Brother", "Sister", "Mother", "Cousin"], "c": 1, "why": "Sister significa irmã."}, {"q": "Choose the correct sentence.", "a": ["She are my friend.", "She is my friend.", "She am my friend.", "She be my friend."], "c": 1, "why": "Usamos she is."}, {"q": "What is the opposite of «old»?", "a": ["Young", "Tall", "Short", "Big"], "c": 0, "why": "Young é o contrário de old quando falamos de idade."}, {"q": "Complete: I ___ eleven years old.", "a": ["is", "are", "am", "be"], "c": 2, "why": "Com I usamos am."}, {"q": "What does «uncle» mean?", "a": ["Avô", "Tio", "Pai", "Primo"], "c": 1, "why": "Uncle significa tio."}, {"q": "Choose the plural of «child».", "a": ["childs", "childes", "children", "childrens"], "c": 2, "why": "O plural irregular de child é children."}, {"q": "Complete: They ___ brothers.", "a": ["is", "am", "are", "be"], "c": 2, "why": "Com they usamos are."}, {"q": "What does «best friend» mean?", "a": ["Melhor amigo", "Irmão mais velho", "Professor", "Vizinho"], "c": 0, "why": "Best friend significa melhor amigo."}, {"q": "Complete: She ___ eleven years old.", "a": ["am", "are", "is", "be"], "c": 2, "why": "Com «she», usa-se «is»."}, {"q": "What is «janela» in English?", "a": ["Door", "Window", "Table", "Chair"], "c": 1, "why": "Window significa janela."}, {"q": "Which number is «fifteen»?", "a": ["5", "13", "15", "50"], "c": 2, "why": "Fifteen significa quinze."}, {"q": "Which word is a fruit?", "a": ["Carrot", "Apple", "Bread", "Milk"], "c": 1, "why": "Apple é maçã."}, {"q": "What is the English word for «cão»?", "a": ["Cat", "Dog", "Bird", "Fish"], "c": 1, "why": "«Dog» significa cão."}, {"q": "Complete: ___ is your name?", "a": ["Where", "What", "When", "Who"], "c": 1, "why": "«What is your name?» pergunta o nome."}, {"q": "Which animal can fly?", "a": ["Horse", "Cow", "Bird", "Dog"], "c": 2, "why": "Bird significa pássaro."}, {"q": "What colour is grass usually?", "a": ["Blue", "Green", "Red", "Purple"], "c": 1, "why": "A relva é geralmente verde: green."}, {"q": "What is «biblioteca» in English?", "a": ["Library", "Kitchen", "Garden", "Bedroom"], "c": 0, "why": "Library significa biblioteca."}, {"q": "Complete: I ___ from Portugal.", "a": ["is", "are", "am", "be"], "c": 2, "why": "Com «I», usa-se «am»."}, {"q": "How do you say «terça-feira» in English?", "a": ["Thursday", "Tuesday", "Saturday", "Sunday"], "c": 1, "why": "Tuesday corresponde a terça-feira."}, {"q": "How do you say «por favor» in English?", "a": ["Sorry", "Please", "Thanks", "Hello"], "c": 1, "why": "Please significa por favor."}, {"q": "What is the plural of «child»?", "a": ["Childs", "Children", "Childes", "Childrens"], "c": 1, "why": "«Children» é o plural irregular de «child»."}];const quiz=document.getElementById('quiz');questions.forEach((x,i)=>{const d=document.createElement('section');d.className='card';const h=document.createElement('h2');h.textContent=(i+1)+'. '+x.q;d.appendChild(h);x.a.forEach((v,j)=>{const label=document.createElement('label');label.className='choice';const input=document.createElement('input');input.type='radio';input.name='q'+i;input.value=j;label.appendChild(input);label.appendChild(document.createTextNode(' '+String.fromCharCode(65+j)+') '+v));d.appendChild(label)});const f=document.createElement('p');f.className='feedback';f.setAttribute('aria-live','polite');d.appendChild(f);quiz.appendChild(d)});document.getElementById('check').onclick=()=>{let score=0,answered=0;[...quiz.children].forEach((d,i)=>{const selected=d.querySelector('input:checked');const f=d.querySelector('.feedback');if(selected){answered++;const ok=Number(selected.value)===questions[i].c;if(ok)score++;f.className='feedback '+(ok?'good':'bad');f.textContent=(ok?'✓ Correto. ':'✗ Incorreto. ')+questions[i].why}else{f.className='feedback bad';f.textContent='Por responder.'}});document.getElementById('result').textContent='Resultado: '+score+' / '+questions.length+' ('+Math.round(score/questions.length*100)+'%) · '+answered+' respostas dadas';try{localStorage.setItem('estudamais_ingles_extra_1',JSON.stringify({score,date:new Date().toISOString()}))}catch(e){}};document.getElementById('reset').onclick=()=>{quiz.reset();document.querySelectorAll('.feedback').forEach(x=>x.textContent='');document.getElementById('result').textContent=''};</script><script type="module" src="../firebase-app-54-5-21.js?v=54.5.30"></script><style id="ep-completion-style">button.ep-correct-pending:disabled{background:#d9e2ee!important;color:#45556a!important;border:1px solid #b8c7d9!important;opacity:1!important;cursor:not-allowed!important;-webkit-text-fill-color:#45556a!important}button.ep-correct-ready{background:#2066b2!important;color:#fff!important;-webkit-text-fill-color:#fff!important}</style><script id="ep-completion-script">(function(){function init(){const btn=[...document.querySelectorAll('button')].find(b=>/^Corrigir (respostas|ficha)$/i.test(b.textContent.trim()));if(!btn)return;function groups(){return [...new Set([...document.querySelectorAll('input[type="radio"][name]')].map(x=>x.name))].filter(n=>/^q\d+$/.test(n))}function update(){const names=groups();const complete=names.length>0&&names.every(n=>[...document.querySelectorAll('input[type="radio"]')].some(x=>x.name===n&&x.checked));btn.disabled=!complete;btn.classList.toggle('ep-correct-pending',!complete);btn.classList.toggle('ep-correct-ready',complete);btn.setAttribute('aria-disabled',String(!complete));}document.addEventListener('change',e=>{if(e.target.matches('input[type="radio"]'))update()});document.addEventListener('reset',()=>setTimeout(update,0));update();}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init()})();</script></body></html>
