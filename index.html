<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Família+ — Organização familiar</title><link rel="manifest" href="manifest.webmanifest?v=19"><link rel="icon" type="image/png" href="icon-192.png?v=19"><link rel="apple-touch-icon" href="apple-touch-icon.png?v=19"><meta name="theme-color" content="#126c62"><link rel="stylesheet" href="style-semana-v90.css?v=90"></head><body><header><b>🏡 Família+</b><span id="identity"></span><button id="logout" hidden>Sair</button></header><main><section id="login"><h1>Bem-vindo à Família+</h1><p class="muted">Toda a família, num só lugar.</p><p id="startupStatus" role="status" aria-live="polite">A iniciar a aplicação…</p><form id="authform"><label>Email<input id="email" type="email" required></label><label>Password<input id="password" type="password" minlength="6" required></label><div class="login-actions"><button disabled>Entrar</button><button type="button" id="register" class="alt" disabled>Criar conta</button><button type="button" id="resetPassword" class="alt" disabled>Recuperar password</button></div></form><p>O administrador autoriza o acesso dos restantes utilizadores.</p><span id="loginVersion" aria-label="Versão da aplicação: 92" style="position:fixed;right:16px;bottom:16px;z-index:10;padding:7px 12px;border:1px solid #bfd5ce;border-radius:8px;background:#fff;color:#173b36;font:14px system-ui">Versão 92</span></section><section id="workspace" hidden><nav id="tabs"></nav><div id="screen"></div></section><p id="feedback" role="status" hidden></p><div id="appToast" class="app-toast" role="status" aria-live="polite" hidden></div></main><script type="module">
const startupStatus=document.getElementById('startupStatus');
const authButtons=Array.from(document.querySelectorAll('#authform button'));
import('./app-impressao-v92.js').then(()=>{
 for(const button of authButtons)button.disabled=false;
 startupStatus.remove();
}).catch(error=>{
 console.error('Falha ao iniciar a Família+:',error);
 startupStatus.textContent='Não foi possível iniciar a aplicação. Atualiza a página. Se continuar, confirma que a atualização foi publicada por completo.';
 startupStatus.setAttribute('role','alert');
});
</script></body></html>
